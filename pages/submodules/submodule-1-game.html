<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Module 1 Minigame: Accounting Crossword | Finance for BIT</title>

    <!-- Theme & Styles -->
    <link rel="stylesheet" href="../../styles.css">
    <link rel="stylesheet" href="../../assets/css/navbar.css">
    <link rel="stylesheet" href="../../assets/css/submodule.css">
    <link rel="stylesheet" href="../../assets/css/login-modal.css">

    <!-- Component Scripts -->
    <script src="../../assets/js/accounts.js" defer></script>
    <script src="../../assets/js/modules-data.js" defer></script>
    <script src="../../assets/js/navbar.js" defer></script>
    <script src="../../assets/js/login-modal.js" defer></script>

    <style>
        .game-wrapper {
            background: rgba(28, 45, 66, 0.5);
            border: 1px solid rgba(179, 146, 88, 0.4);
            border-radius: 16px;
            padding: 2rem;
            margin-top: 1.5rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        /* Top Active Clue Banner */
        .active-clue-banner {
            background: #1a2638;
            border: 2px solid #b39258;
            border-radius: 12px;
            padding: 1rem 1.5rem;
            margin-bottom: 1.75rem;
            display: flex;
            align-items: center;
            gap: 1.25rem;
            font-size: 1.15rem;
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .active-clue-badge {
            background: #b39258;
            color: #000000;
            font-weight: 800;
            padding: 0.35rem 0.9rem;
            border-radius: 8px;
            font-size: 0.95rem;
            white-space: nowrap;
        }

        .active-clue-text {
            font-weight: 700;
            color: #f7fafc;
            line-height: 1.4;
        }

        /* Grid Viewport & Matrix */
        .grid-viewport {
            background: rgba(13, 19, 29, 0.8);
            border: 1px solid rgba(179, 146, 88, 0.3);
            border-radius: 12px;
            padding: 1.5rem;
            overflow-x: auto;
            max-width: 100%;
            margin: 0 auto 1.5rem;
            display: flex;
            justify-content: center;
            box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        .crossword-grid-matrix {
            display: grid;
            grid-template-columns: repeat(35, 32px);
            grid-template-rows: repeat(22, 32px);
            gap: 2px;
            width: fit-content;
            margin: 0 auto;
            user-select: none;
            padding: 4px;
        }

        .cell {
            position: relative;
            background: #ffffff !important;
            border: 2px solid #1a202c !important;
            border-radius: 4px;
            box-sizing: border-box;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            transition: all 0.12s ease;
        }

        .cell.blocked {
            visibility: hidden !important;
            pointer-events: none !important;
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
        }

        .cell-number {
            position: absolute;
            top: 1px;
            left: 2px;
            font-size: 0.65rem;
            color: #0f172a;
            font-weight: 900;
            pointer-events: none;
            z-index: 2;
            line-height: 1;
        }

        .cell input {
            width: 100%;
            height: 100%;
            background: transparent;
            border: none;
            text-align: center;
            font-size: 1.15rem;
            font-weight: 900;
            color: #0f172a;
            text-transform: uppercase;
            outline: none;
            font-family: inherit;
            padding-top: 3px;
            box-sizing: border-box;
            cursor: pointer;
        }

        /* Highlighting states */
        .cell.cell-word-highlight {
            background: #fef08a !important;
            /* Soft yellow for active word line */
            border-color: #ca8a04 !important;
        }

        .cell.cell-focused {
            background: #3b82f6 !important;
            /* Vivid blue for active focused box */
            border-color: #1d4ed8 !important;
        }

        .cell.cell-focused input {
            color: #ffffff !important;
        }

        .cell.correct {
            background: #bbf7d0 !important;
            border-color: #16a34a !important;
        }

        .cell.correct input {
            color: #15803d !important;
        }

        .cell.wrong {
            background: #fecaca !important;
            border-color: #dc2626 !important;
        }

        .cell.wrong input {
            color: #b91c1c !important;
        }

        /* Action Controls Bar */
        .controls-bar {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-bottom: 2rem;
        }

        .btn-check-crossword {
            background: var(--theme-gold, #b39258);
            color: #000000;
            font-weight: 800;
            border: none;
            padding: 0.9rem 2rem;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1.05rem;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(179, 146, 88, 0.3);
        }

        .btn-check-crossword:hover {
            background: #c5a367;
            transform: translateY(-2px);
        }

        /* Hints / Clues Section Placed Below Grid */
        .clues-section-below {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            padding: 1.75rem;
        }

        .clues-section-header {
            color: #b39258;
            font-size: 1.25rem;
            font-weight: 800;
            margin-bottom: 1.25rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid rgba(179, 146, 88, 0.3);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .clues-grid-two-col {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
        }

        @media (max-width: 768px) {
            .clues-grid-two-col {
                grid-template-columns: 1fr;
            }
        }

        .clues-column-title {
            color: #ffffff;
            font-size: 1.1rem;
            font-weight: 800;
            margin-bottom: 0.85rem;
            padding-bottom: 0.4rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .clue-item {
            font-size: 0.95rem;
            color: #cbd5e1;
            padding: 0.6rem 0.85rem;
            border-radius: 8px;
            margin-bottom: 0.5rem;
            cursor: pointer;
            line-height: 1.45;
            transition: all 0.15s ease;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .clue-item:hover {
            background: rgba(179, 146, 88, 0.15);
            border-color: rgba(179, 146, 88, 0.3);
        }

        .clue-item.active {
            background: rgba(179, 146, 88, 0.25);
            color: #ffffff;
            border-left: 4px solid #b39258;
            font-weight: 600;
        }

        .clue-num {
            color: #b39258;
            font-weight: 800;
            margin-right: 6px;
        }

        .clue-text-content {
            flex: 1;
        }

        .hint-btn {
            background: rgba(179, 146, 88, 0.2);
            border: 1px solid rgba(179, 146, 88, 0.4);
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            padding: 0.25rem 0.45rem;
            line-height: 1;
            transition: all 0.2s ease;
            position: relative;
            flex-shrink: 0;
        }

        .hint-btn:hover {
            background: rgba(179, 146, 88, 0.45);
            border-color: #b39258;
            transform: scale(1.15);
        }

        .hint-btn::after {
            content: 'View Answer';
            position: absolute;
            bottom: calc(100% + 6px);
            left: 50%;
            transform: translateX(-50%) scale(0.9);
            background: #1a2638;
            color: #f7fafc;
            font-size: 0.72rem;
            font-weight: 700;
            padding: 0.3rem 0.6rem;
            border-radius: 6px;
            white-space: nowrap;
            border: 1px solid #b39258;
            opacity: 0;
            pointer-events: none;
            transition: all 0.18s ease;
            z-index: 10;
        }

        .hint-btn:hover::after {
            opacity: 1;
            transform: translateX(-50%) scale(1);
        }
    </style>
</head>

<body data-submodule-id="1-game">

    <app-navbar></app-navbar>

    <main class="submodule-page">
        <div class="submodule-container" style="max-width: 1350px;">

            <a href="submodule-1-4.html" class="back-link">
                ← Back to Submodule 1.4
            </a>

            <div class="submodule-hero">
                <span class="submodule-tag">Module 1 Interactive Minigame</span>
                <h1 class="submodule-main-title">🧩 Financial Accounting Crossword</h1>
                <p class="submodule-lead">
                    Click any box to highlight the word line and type directly across or down! Review the clues below
                    the grid.
                </p>
            </div>

            <div class="game-wrapper">

                <!-- Top Active Clue Banner -->
                <div class="active-clue-banner">
                    <span class="active-clue-badge" id="activeClueBadge">1 DOWN</span>
                    <span class="active-clue-text" id="activeClueText">Click any box to start typing</span>
                </div>

                <!-- Centered Responsive Grid Viewport -->
                <div class="grid-viewport" id="gridViewport">
                    <div class="crossword-grid-matrix" id="crosswordGrid">
                        <!-- Matrix generated by JS -->
                    </div>
                </div>

                <!-- Controls & Validation -->
                <div class="controls-bar">
                    <button class="btn-check-crossword" onclick="checkCrosswordAnswers()">
                        ✓ Check Crossword Answers
                    </button>
                </div>
                <div id="gameFeedback"
                    style="margin-bottom: 2rem; text-align: center; font-weight: 800; font-size: 1.15rem;"></div>

                <!-- Hints / Clues Section Placed Below Grid -->
                <div class="clues-section-below">
                    <div class="clues-section-header">
                        💡 Crossword Clues & Hints
                    </div>

                    <div class="clues-grid-two-col">
                        <div>
                            <div class="clues-column-title">Across Clues</div>
                            <div id="acrossCluesList"></div>
                        </div>

                        <div>
                            <div class="clues-column-title">Down Clues</div>
                            <div id="downCluesList"></div>
                        </div>
                    </div>
                </div>

            </div>

        </div>
    </main>

    <app-login-modal></app-login-modal>

    <script>
        /* ===================================================
           EXACT 15 FINANCIAL ACCOUNTING CROSSWORD DATA (FULLY VERIFIED & MATCHED)
           =================================================== */
        const WORDS_DATA = [
            { num: 1, dir: 'down', word: 'REVENUE', r: 0, c: 10, clue: 'The top line of the Income Statement, total income from goods or services sold' },
            { num: 2, dir: 'down', word: 'DEPRECIATION', r: 1, c: 7, clue: 'The systematic allocation of an asset\'s cost over its useful life' },
            { num: 3, dir: 'across', word: 'LIABILITIES', r: 1, c: 14, clue: 'Debts and financial obligations owed to external parties' },
            { num: 4, dir: 'down', word: 'BALANCESHEET', r: 1, c: 17, clue: 'Statement showing Assets = Liabilities + Equity at a point in time' },
            { num: 5, dir: 'across', word: 'WORKINGCAPITAL', r: 4, c: 5, clue: 'Current Assets minus Current Liabilities; measures short-term liquidity' },
            { num: 6, dir: 'down', word: 'ASSETS', r: 6, c: 3, clue: 'Valuable resources owned by a company expected to produce future value' },
            { num: 7, dir: 'across', word: 'EBITNA', r: 6, c: 10, clue: 'Earnings metric evaluating core operating performance' },
            { num: 8, dir: 'across', word: 'CASHFLOW', r: 6, c: 17, clue: 'Actual cash movements in Operating, Investing, and Financing activities' },
            { num: 9, dir: 'across', word: 'GROSSMARGIN', r: 8, c: 13, clue: '(Gross Profit / Revenue) * 100; percentage of revenue retained after COGS' },
            { num: 10, dir: 'across', word: 'EQUITY', r: 9, c: 3, clue: 'Ownership claim on total assets after deducting total liabilities' },
            { num: 11, dir: 'across', word: 'GROSSPROFIT', r: 11, c: 0, clue: 'Revenue minus Cost of Goods Sold (COGS)' },
            { num: 12, dir: 'across', word: 'RETAINEDEARNINGS', r: 11, c: 16, clue: 'Cumulative net income reinvested in the business rather than paid as dividends' },
            { num: 13, dir: 'down', word: 'NETINCOME', r: 11, c: 27, clue: 'The final "bottom line" profit after all expenses, interest, and taxes' },
            { num: 14, dir: 'across', word: 'LIQUIDITY', r: 14, c: 23, clue: 'Ability of a business to convert assets into cash to pay short-term debt' },
            { num: 15, dir: 'across', word: 'CAPEX', r: 16, c: 27, clue: 'Capital expenditures spent on acquiring or upgrading long-term physical assets' }
        ];

        const ROWS = 22;
        const COLS = 35;
        let cellMap = {}; // "r_c" -> { letter, words: [], inputEl, cellEl }
        let currentActiveWord = null;
        let currentFocusedCell = null; // { r, c }

        function initCrosswordEngine() {
            const gridEl = document.getElementById('crosswordGrid');
            const acrossList = document.getElementById('acrossCluesList');
            const downList = document.getElementById('downCluesList');
            gridEl.innerHTML = '';
            acrossList.innerHTML = '';
            downList.innerHTML = '';

            // Initialize cellMap
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    cellMap[`${r}_${c}`] = { letter: null, words: [], number: null, inputEl: null, cellEl: null };
                }
            }

            // Map words onto grid
            WORDS_DATA.forEach(w => {
                const isAcross = w.dir === 'across';
                if (cellMap[`${w.r}_${w.c}`]) {
                    cellMap[`${w.r}_${w.c}`].number = w.num;
                }

                for (let i = 0; i < w.word.length; i++) {
                    const r = isAcross ? w.r : w.r + i;
                    const c = isAcross ? w.c + i : w.c;
                    const key = `${r}_${c}`;

                    if (cellMap[key]) {
                        cellMap[key].letter = w.word[i].toUpperCase();
                        cellMap[key].words.push(w);
                    }
                }

                // Render clue item with hint button
                const clueHtml = `
                    <div class="clue-item" id="clue_${w.num}_${w.dir}" onclick="selectWordByObj(WORDS_DATA[${WORDS_DATA.indexOf(w)}])">
                        <span class="clue-text-content"><span class="clue-num">${w.num}.</span> ${w.clue}</span>
                        <button class="hint-btn" onclick="event.stopPropagation(); fillAnswer(WORDS_DATA[${WORDS_DATA.indexOf(w)}])">💡</button>
                    </div>`;

                if (isAcross) acrossList.innerHTML += clueHtml;
                else downList.innerHTML += clueHtml;
            });

            // Render grid DOM cells
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const key = `${r}_${c}`;
                    const info = cellMap[key];

                    const cellDiv = document.createElement('div');
                    cellDiv.className = info.letter ? 'cell' : 'cell blocked';
                    cellDiv.setAttribute('data-r', r);
                    cellDiv.setAttribute('data-c', c);

                    if (info.letter) {
                        if (info.number) {
                            cellDiv.innerHTML += `<span class="cell-number">${info.number}</span>`;
                        }
                        const input = document.createElement('input');
                        input.type = 'text';
                        input.maxLength = 1;
                        input.setAttribute('data-r', r);
                        input.setAttribute('data-c', c);

                        // Attach Event Handlers for smooth typing & navigation
                        input.addEventListener('click', (e) => handleCellClick(r, c));
                        input.addEventListener('keydown', (e) => handleKeyDown(e, r, c));
                        input.addEventListener('input', (e) => handleInput(e, r, c));

                        cellDiv.appendChild(input);
                        info.inputEl = input;
                    }
                    cellDiv.id = `cell_${r}_${c}`;
                    info.cellEl = cellDiv;
                    gridEl.appendChild(cellDiv);
                }
            }

            // Select default word (1 Down)
            selectWordByObj(WORDS_DATA[0]);
        }

        function handleCellClick(r, c) {
            const info = cellMap[`${r}_${c}`];
            if (!info.letter) return;

            // If clicking same cell and it belongs to multiple words (intersection), toggle word!
            if (currentFocusedCell && currentFocusedCell.r === r && currentFocusedCell.c === c && info.words.length > 1) {
                const nextWord = info.words.find(w => w !== currentActiveWord) || info.words[0];
                selectWordByObj(nextWord, r, c);
            } else {
                let targetWord = info.words.find(w => w === currentActiveWord);
                if (!targetWord) targetWord = info.words[0];
                selectWordByObj(targetWord, r, c);
            }
        }

        function selectWordByObj(wObj, targetR, targetC) {
            currentActiveWord = wObj;
            const r = targetR != null ? targetR : wObj.r;
            const c = targetC != null ? targetC : wObj.c;
            currentFocusedCell = { r, c };

            // Update Header Banner & Clue List UI
            document.getElementById('activeClueBadge').innerText = `${wObj.num} ${wObj.dir.toUpperCase()}`;
            document.getElementById('activeClueText').innerText = wObj.clue;

            document.querySelectorAll('.clue-item').forEach(el => el.classList.remove('active'));
            const clueEl = document.getElementById(`clue_${wObj.num}_${wObj.dir}`);
            if (clueEl) {
                clueEl.classList.add('active');
            }

            highlightActiveWordLine();

            // Focus cell input without auto-scrolling
            const info = cellMap[`${r}_${c}`];
            if (info && info.inputEl) {
                info.inputEl.focus({ preventScroll: true });
                info.inputEl.select();
            }
        }

        function highlightActiveWordLine() {
            // Remove previous highlights
            document.querySelectorAll('.cell').forEach(el => {
                el.classList.remove('cell-word-highlight', 'cell-focused');
            });

            if (!currentActiveWord) return;

            const isAcross = currentActiveWord.dir === 'across';
            for (let i = 0; i < currentActiveWord.word.length; i++) {
                const r = isAcross ? currentActiveWord.r : currentActiveWord.r + i;
                const c = isAcross ? currentActiveWord.c + i : currentActiveWord.c;
                const info = cellMap[`${r}_${c}`];
                if (info && info.cellEl) {
                    info.cellEl.classList.add('cell-word-highlight');
                }
            }

            if (currentFocusedCell) {
                const focusedInfo = cellMap[`${currentFocusedCell.r}_${currentFocusedCell.c}`];
                if (focusedInfo && focusedInfo.cellEl) {
                    focusedInfo.cellEl.classList.add('cell-focused');
                }
            }
        }

        function handleInput(e, r, c) {
            const val = e.target.value.toUpperCase();
            e.target.value = val;

            if (val.length === 1 && currentActiveWord) {
                advanceFocus(r, c, 1);
            }
        }

        function handleKeyDown(e, r, c) {
            if (e.key === 'Backspace') {
                const input = cellMap[`${r}_${c}`].inputEl;
                if (input.value === '') {
                    e.preventDefault();
                    advanceFocus(r, c, -1);
                    const prevInput = cellMap[`${currentFocusedCell.r}_${currentFocusedCell.c}`].inputEl;
                    if (prevInput) prevInput.value = '';
                }
            } else if (e.key === 'ArrowRight') {
                e.preventDefault();
                moveGridDirection(r, c, 0, 1);
            } else if (e.key === 'ArrowLeft') {
                e.preventDefault();
                moveGridDirection(r, c, 0, -1);
            } else if (e.key === 'ArrowDown') {
                e.preventDefault();
                moveGridDirection(r, c, 1, 0);
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                moveGridDirection(r, c, -1, 0);
            }
        }

        function advanceFocus(r, c, delta) {
            if (!currentActiveWord) return;
            const isAcross = currentActiveWord.dir === 'across';

            let idx = isAcross ? (c - currentActiveWord.c) : (r - currentActiveWord.r);
            let nextIdx = idx + delta;

            if (nextIdx >= 0 && nextIdx < currentActiveWord.word.length) {
                const nextR = isAcross ? currentActiveWord.r : currentActiveWord.r + nextIdx;
                const nextC = isAcross ? currentActiveWord.c + nextIdx : currentActiveWord.c;
                selectWordByObj(currentActiveWord, nextR, nextC);
            }
        }

        function moveGridDirection(r, c, dr, dc) {
            let nextR = r + dr;
            let nextC = c + dc;
            const key = `${nextR}_${nextC}`;

            if (cellMap[key] && cellMap[key].letter) {
                const info = cellMap[key];
                let wordToPick = info.words.find(w => w === currentActiveWord) || info.words[0];
                selectWordByObj(wordToPick, nextR, nextC);
            }
        }

        function checkCrosswordAnswers() {
            let correctLetters = 0;
            let totalLetters = 0;

            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const info = cellMap[`${r}_${c}`];
                    if (info.letter && info.inputEl) {
                        totalLetters++;
                        const userChar = info.inputEl.value.trim().toUpperCase();
                        info.cellEl.classList.remove('correct', 'wrong');

                        if (userChar === info.letter) {
                            info.cellEl.classList.add('correct');
                            correctLetters++;
                        } else if (userChar !== '') {
                            info.cellEl.classList.add('wrong');
                        }
                    }
                }
            }

            const feedback = document.getElementById('gameFeedback');
            if (correctLetters === totalLetters && totalLetters > 0) {
                // Mark submodule 1-4 completed and unlock 2-1
                markSubmoduleComplete('1-4', '2-1');

                feedback.style.color = '#2ecc71';
                feedback.innerHTML = `
                    <div style="font-size: 1.3rem; margin-bottom: 0.75rem;">🎉 CONGRATULATIONS! You solved the entire crossword!</div>
                    <div style="color: #cbd5e1; font-weight: normal; margin-bottom: 1.25rem;">Module 1 is now completed! Module 2 has been unlocked.</div>
                    <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
                        <a href="submodule-2-1.html" class="btn-check-crossword" style="text-decoration: none; display: inline-block;">
                            Continue to Module 2 (Submodule 2.1) →
                        </a>
                        <a href="../modules.html" class="btn-check-crossword" style="text-decoration: none; display: inline-block; background: #334155; color: #fff;">
                            Back to Curriculum Room
                        </a>
                    </div>
                `;
            } else {
                feedback.style.color = '#e74c3c';
                feedback.innerHTML = `You have ${correctLetters} of ${totalLetters} letters correct. Keep going!`;
            }
        }

        function markSubmoduleComplete(subId, nextSubId) {
            if (window.FinanceAccounts) {
                const session = window.FinanceAccounts.getActiveSession();
                const userId = session ? session.userId : 'demo';
                const userProgress = window.FinanceAccounts.getUserProgress(userId);

                if (!userProgress.completedSubmodules.includes(subId)) {
                    userProgress.completedSubmodules.push(subId);
                }

                if (nextSubId && !userProgress.unlockedSubmodules.includes(nextSubId)) {
                    userProgress.unlockedSubmodules.push(nextSubId);
                }

                window.FinanceAccounts.saveUserProgress(userId, userProgress);
            }
        }

        function fillAnswer(wObj) {
            const isAcross = wObj.dir === 'across';
            for (let i = 0; i < wObj.word.length; i++) {
                const r = isAcross ? wObj.r : wObj.r + i;
                const c = isAcross ? wObj.c + i : wObj.c;
                const info = cellMap[`${r}_${c}`];
                if (info && info.inputEl) {
                    info.inputEl.value = wObj.word[i].toUpperCase();
                    // Add a brief gold flash to show it was filled
                    info.cellEl.classList.remove('correct', 'wrong');
                    info.cellEl.classList.add('correct');
                }
            }
            // Select the word to highlight it
            selectWordByObj(wObj);
        }

        document.addEventListener('DOMContentLoaded', initCrosswordEngine);
    </script>
</body>
