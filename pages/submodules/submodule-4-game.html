<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Module 4 Minigame: 16-Card Memory Flip | Finance for BIT</title>

    <!-- Theme & Styles -->
    <link rel="stylesheet" href="../../styles.css">
    <link rel="stylesheet" href="../../assets/css/navbar.css">
    <link rel="stylesheet" href="../../assets/css/submodule.css">
    <link rel="stylesheet" href="../../assets/css/login-modal.css">

    <!-- Component Scripts -->
    <script src="../../assets/js/accounts.js" defer></script>
    <script src="../../assets/js/modules-data.js" defer></script>
    <script src="../../assets/js/navbar.js" defer></script>
    <script src="../../assets/js/login-modal.js" defer></script>

    <style>
        .game-wrapper {
            background: rgba(28, 45, 66, 0.4);
            border: 1px solid rgba(179, 146, 88, 0.3);
            border-radius: 16px;
            padding: 2.5rem;
            margin-top: 1.5rem;
        }

        .memory-stats-bar {
            display: flex;
            justify-content: space-around;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 1rem 1.5rem;
            margin-bottom: 2rem;
            text-align: center;
        }

        .stat-box .stat-label {
            font-size: 0.8rem;
            color: #a0aec0;
            text-transform: uppercase;
        }

        .stat-box .stat-val {
            font-size: 1.8rem;
            font-weight: 800;
            color: #b39258;
        }

        .memory-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1rem;
            max-width: 720px;
            margin: 0 auto;
        }

        @media (max-width: 600px) {
            .memory-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        .memory-card {
            background: #0d131d;
            border: 2px solid rgba(179, 146, 88, 0.3);
            border-radius: 12px;
            height: 110px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 0.75rem;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            user-select: none;
            transition: transform 0.3s ease, border-color 0.3s ease, background 0.3s ease;
            position: relative;
        }

        .memory-card:hover:not(.flipped):not(.matched) {
            transform: translateY(-4px);
            border-color: #b39258;
            box-shadow: 0 4px 15px rgba(179, 146, 88, 0.2);
        }

        .memory-card.flipped {
            background: rgba(179, 146, 88, 0.2);
            border-color: #b39258;
            color: #ffffff;
        }

        .memory-card.matched {
            background: rgba(46, 204, 113, 0.2);
            border-color: #2ecc71;
            color: #2ecc71;
            cursor: default;
        }

        .card-back-icon {
            font-size: 2.2rem;
            color: #b39258;
        }

        .btn-restart {
            background: var(--theme-gold, #b39258);
            color: #000;
            font-weight: 800;
            border: none;
            padding: 0.85rem 1.75rem;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1rem;
            margin-top: 2rem;
            transition: all 0.2s ease;
        }

        .btn-restart:hover {
            background: #c5a367;
            transform: translateY(-2px);
        }
    </style>
</head>

<body data-submodule-id="4-game">

    <app-navbar></app-navbar>

    <main class="submodule-page">
        <div class="submodule-container">

            <a href="submodule-4-7.html" class="back-link">
                ← Back to Submodule 4.7
            </a>

            <div class="submodule-hero">
                <span class="submodule-tag">Module 4 Interactive Minigame</span>
                <h1 class="submodule-main-title">🃏 16-Card Memory Flip Challenge</h1>
                <p class="submodule-lead">
                    Flip cards to match Applied Finance career terms with their definitions. Find all 8 pairs in as few
                    moves as possible!
                </p>
            </div>

            <div class="game-wrapper">

                <!-- Stats Bar -->
                <div class="memory-stats-bar">
                    <div class="stat-box">
                        <div class="stat-label">Moves Taken</div>
                        <div class="stat-val" id="movesVal">0</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-label">Pairs Matched</div>
                        <div class="stat-val" id="matchesVal">0 / 8</div>
                    </div>
                </div>

                <!-- 16 Card Grid -->
                <div class="memory-grid" id="memoryGrid">
                    <!-- 16 cards auto generated by JS -->
                </div>

                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <button class="btn-restart" onclick="initMemoryGame()">🔄 Reset Board</button>
                    <div id="gameVictoryMsg" style="font-weight: 800; font-size: 1.2rem; color: #2ecc71;"></div>
                </div>

            </div>

        </div>
    </main>

    <app-login-modal></app-login-modal>

    <script>
        /* ===================================================
           USER EDITABLE PLACEHOLDER PAIRS FOR MODULE 4 MEMORY FLIP
           (8 Pairs = 16 Cards Total)
           =================================================== */
        const MEMORY_PAIRS = [
            { id: 1, text: "Investment Banking" },
            { id: 1, text: "M&A Advisory & Underwriting" },
            { id: 2, text: "Equity Research" },
            { id: 2, text: "Stock Buy/Sell Reports" },
            { id: 3, text: "Private Equity" },
            { id: 3, text: "LBO Buyouts & Cap Tables" },
            { id: 4, text: "Hedge Funds" },
            { id: 4, text: "Absolute Return & Long/Short" },
            { id: 5, text: "Sales & Trading" },
            { id: 5, text: "Market Making & Trade Execution" },
            { id: 6, text: "Asset Management" },
            { id: 6, text: "Fiduciary Portfolio Oversight" },
            { id: 7, text: "Corporate Finance" },
            { id: 7, text: "FP&A & Treasury Operations" },
            { id: 8, text: "Venture Capital" },
            { id: 8, text: "Early-Stage Startup Funding" }
        ];

        let cards = [];
        let flippedCards = [];
        let moves = 0;
        let matchedPairs = 0;
        let isLock = false;

        function initMemoryGame() {
            moves = 0;
            matchedPairs = 0;
            flippedCards = [];
            isLock = false;

            document.getElementById('movesVal').innerText = '0';
            document.getElementById('matchesVal').innerText = '0 / 8';
            document.getElementById('gameVictoryMsg').innerText = '';

            // Shuffle cards
            cards = [...MEMORY_PAIRS].sort(() => Math.random() - 0.5);

            const gridEl = document.getElementById('memoryGrid');
            gridEl.innerHTML = '';

            cards.forEach((cardObj, idx) => {
                const cardDiv = document.createElement('div');
                cardDiv.className = 'memory-card';
                cardDiv.setAttribute('data-index', idx);
                cardDiv.setAttribute('data-pair-id', cardObj.id);
                cardDiv.innerHTML = `<span class="card-back-icon">⚜️</span>`;
                cardDiv.onclick = () => flipCard(cardDiv, cardObj);
                gridEl.appendChild(cardDiv);
            });
        }

        function flipCard(cardDiv, cardObj) {
            if (isLock || cardDiv.classList.contains('flipped') || cardDiv.classList.contains('matched')) return;

            cardDiv.classList.add('flipped');
            cardDiv.innerHTML = cardObj.text;
            flippedCards.push({ cardDiv, cardObj });

            if (flippedCards.length === 2) {
                moves++;
                document.getElementById('movesVal').innerText = moves;
                checkMatch();
            }
        }

        function checkMatch() {
            isLock = true;
            const [c1, c2] = flippedCards;

            if (c1.cardObj.id === c2.cardObj.id) {
                // Match!
                c1.cardDiv.classList.add('matched');
                c2.cardDiv.classList.add('matched');
                matchedPairs++;
                document.getElementById('matchesVal').innerText = `${matchedPairs} / 8`;
                flippedCards = [];
                isLock = false;

                if (matchedPairs === 8) {
                    // Mark submodule 4-7 completed (final graduation)
                    markSubmoduleComplete('4-7', null);

                    document.getElementById('gameVictoryMsg').innerHTML = `
                        <div style="text-align: center;">
                            <div style="font-size: 1.3rem; margin-bottom: 0.5rem;">🎓 CONGRATULATIONS! You matched all 8 pairs and graduated the curriculum!</div>
                            <div style="font-size: 0.95rem; color: #cbd5e1; margin-bottom: 0.75rem;">All 4 modules and 20 submodules are now 100% completed!</div>
                            <a href="../modules.html" class="btn-restart" style="text-decoration: none; display: inline-block; margin-top: 0.5rem;">
                                🏆 View Curriculum Room Progress
                            </a>
                        </div>
                    `;
                }
            } else {
                // No match
                setTimeout(() => {
                    c1.cardDiv.classList.remove('flipped');
                    c2.cardDiv.classList.remove('flipped');
                    c1.cardDiv.innerHTML = `<span class="card-back-icon">⚜️</span>`;
                    c2.cardDiv.innerHTML = `<span class="card-back-icon">⚜️</span>`;
                    flippedCards = [];
                    isLock = false;
                }, 1000);
            }
        }

        function markSubmoduleComplete(subId, nextSubId) {
            if (window.FinanceAccounts) {
                const session = window.FinanceAccounts.getActiveSession();
                const userId = session ? session.userId : 'demo';
                const userProgress = window.FinanceAccounts.getUserProgress(userId);

                if (!userProgress.completedSubmodules.includes(subId)) {
                    userProgress.completedSubmodules.push(subId);
                }

                if (nextSubId && !userProgress.unlockedSubmodules.includes(nextSubId)) {
                    userProgress.unlockedSubmodules.push(nextSubId);
                }

                window.FinanceAccounts.saveUserProgress(userId, userProgress);
            }
        }

        document.addEventListener('DOMContentLoaded', initMemoryGame);
    </script>
</body>

</html>
